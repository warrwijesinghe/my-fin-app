name: Deploy to mdev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fin-app-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up production Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Validate deployment script
        run: bash -n scripts/deploy-mdev.sh
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Check TypeScript
        run: npm run lint
      - name: Test financial workflows
        run: npm test
      - name: Build application
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify SSH host and run server deployment script
        shell: bash
        env:
          MDEV_HOST: ${{ secrets.MDEV_HOST }}
          MDEV_USER: ${{ secrets.MDEV_USER }}
          MDEV_SSH_PORT: ${{ secrets.MDEV_SSH_PORT }}
          MDEV_SSH_KEY: ${{ secrets.MDEV_SSH_KEY }}
          MDEV_SSH_FINGERPRINT: ${{ secrets.MDEV_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          fail() { printf '::error::%s\n' "$1" >&2; exit 1; }
          for name in MDEV_HOST MDEV_USER MDEV_SSH_PORT MDEV_SSH_KEY MDEV_SSH_FINGERPRINT; do
            [[ -n "${!name}" ]] || fail "Required GitHub secret is missing: $name."
          done
          [[ "$MDEV_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ]] || fail 'MDEV_HOST must be a hostname or an IP address.'
          [[ "$MDEV_USER" == ubuntu ]] || fail 'MDEV_USER must be ubuntu for this production server.'
          [[ "$MDEV_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || fail 'MDEV_SSH_PORT must be a numeric port.'
          (( 10#$MDEV_SSH_PORT >= 1 && 10#$MDEV_SSH_PORT <= 65535 )) || fail 'MDEV_SSH_PORT is out of range.'
          [[ "$MDEV_SSH_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || fail 'MDEV_SSH_FINGERPRINT must be a complete OpenSSH SHA256 fingerprint.'

          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$MDEV_SSH_KEY" > "$ssh_dir/key"
          unset MDEV_SSH_KEY
          ssh-keygen -y -P '' -f "$ssh_dir/key" >/dev/null 2>&1 || fail 'MDEV_SSH_KEY must be a valid private key usable without a passphrase.'

          # Keyscan is untrusted discovery. Trust only the key whose SHA256
          # fingerprint matches the independently configured GitHub secret.
          ssh-keyscan -T 10 -p "$MDEV_SSH_PORT" -t ed25519,ecdsa,rsa "$MDEV_HOST" \
            > "$ssh_dir/scanned_hosts" 2>/dev/null || fail 'Could not obtain SSH host keys.'
          : > "$ssh_dir/known_hosts"
          while IFS= read -r host_key; do
            [[ -n "$host_key" && "$host_key" != \#* ]] || continue
            printf '%s\n' "$host_key" > "$ssh_dir/candidate"
            if fingerprint="$(ssh-keygen -lf "$ssh_dir/candidate" -E sha256 2>/dev/null | awk '{print $2}')"; then
              if [[ "$fingerprint" == "$MDEV_SSH_FINGERPRINT" ]]; then
                printf '%s\n' "$host_key" >> "$ssh_dir/known_hosts"
              fi
            fi
          done < "$ssh_dir/scanned_hosts"
          [[ -s "$ssh_dir/known_hosts" ]] || fail 'SSH host fingerprint mismatch. Deployment refused.'

          ssh -F /dev/null -T -p "$MDEV_SSH_PORT" -l "$MDEV_USER" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o UpdateHostKeys=no \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$MDEV_HOST" \
            'cd /srv/fin-app || { printf "Cannot enter /srv/fin-app.\n" >&2; exit 1; }
             if ! git diff --quiet --ignore-submodules -- || ! git diff --cached --quiet --ignore-submodules; then
               printf "[deploy] Saving tracked server changes in a Git stash before deployment.\n"
               git stash push --message "fin-app deployment safeguard $(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null 2>&1 || { printf "Could not preserve tracked server changes in a Git stash.\n" >&2; exit 1; }
             fi
             test -r scripts/deploy-mdev.sh || { printf "Deployment script missing; complete the bootstrap in deploy/README.md.\n" >&2; exit 1; }
             exec timeout --signal=TERM --kill-after=30s 20m /bin/bash scripts/deploy-mdev.sh'
