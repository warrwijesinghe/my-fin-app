name: Deploy to mdev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.MDEV_HOST }}
          username: ${{ secrets.MDEV_USER }}
          port: ${{ secrets.MDEV_SSH_PORT }}
          key: ${{ secrets.MDEV_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/fin-app
            test -f .env
            env_backup="$(mktemp)"
            trap 'rm -f "$env_backup"' EXIT
            cp .env "$env_backup"

            git fetch --prune origin main
            git checkout --force main
            git reset --hard origin/main
            git clean -ffd
            install -m 600 "$env_backup" .env

            npm ci
            if node -e "const scripts = require('./package.json').scripts || {}; process.exit(scripts['db:migrate'] ? 0 : 1)"; then
              npm run db:migrate
            fi
            npm run build

            sudo systemctl restart fin-app
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error http://127.0.0.1:4010/api/health; then
                exit 0
              fi
              sleep 2
            done
            exit 1
